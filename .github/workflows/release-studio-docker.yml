# Studio Docker Workflow
# ======================
#
# PURPOSE:
# Builds and publishes the loopstack-studio Docker image.
# Called by release workflows.
#
# The app bundle is built from the workspace on the runner and copied into
# the image, so the image ships the same code the repo was tested with.
#
# INPUTS:
# - version: Version tag for the image
#
# MANUAL TRIGGER:
# Can rebuild images without republishing to npm.

name: Release Studio Docker

env:
  NODE_VERSION: '24'

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to tag the image with'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: 'Version (leave empty to read from package.json)'
        required: false
        type: string

jobs:
  publish:
    name: 'Build & Publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./frontend/studio/package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: npx turbo run build --filter='@loopstack/loopstack-studio^...'

      - name: Build Studio bundle
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build:prod -w @loopstack/loopstack-studio

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta-stable
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/loopstack-ai/loopstack-studio
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/studio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-stable.outputs.tags }}
          labels: ${{ steps.meta-stable.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Create summary
        run: |
          echo "## Studio Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
