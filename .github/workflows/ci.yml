# ============================================================================
# CI Workflow - Runs on PRs to main
# ============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # CI - Quality checks, build, and tests in a single job
  # ──────────────────────────────────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest

    # Backing services for the smoke run against the real backend
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # `sandbox/*` is a glob, and untracked sandbox projects (the engineer clone, throwaway test apps)
      # join the workspace locally. They must never reach the committed lockfile: a clean clone holds only
      # the tracked sandbox apps, so regenerating here must be a no-op. A diff means a local install leaked.
      - name: Lockfile is canonical
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code package-lock.json

      - name: Build packages
        run: npm run build

      - name: Typecheck
        run: npm run compile --if-present

      - name: Check formatting
        run: npm run format:check --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      # Boots the examples app on Postgres + Redis and runs the deterministic example
      # workflows through the CLI: HTTP start, queue, persistence, sub-workflow callbacks.
      - name: Smoke run
        working-directory: examples
        env:
          DATABASE_URL: postgres://postgres:admin@127.0.0.1:5432/postgres
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run smoke

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ──────────────────────────────────────────────────────────────────────────
  # Pre-release Hook - Only on PRs to main (excludes develop → main merges)
  # ──────────────────────────────────────────────────────────────────────────
  pre-release-hook:
    name: Pre-release hook
    needs: [ci]
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pre-release event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SMOKE_TESTING_TOKEN }}
          repository: loopstack-ai/smoke-testing
          event-type: pre-release
          client-payload: >-
            {
              "ref": "${{ github.event.pull_request.head.sha }}",
              "pr_number": ${{ github.event.pull_request.number }}
            }
