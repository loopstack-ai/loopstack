customHeaders:
  - pattern: '**'
    headers:
      - key: Link
        value: '</llms.txt>; rel="llms-txt", </llms-full.txt>; rel="llms-full-txt"'
      - key: X-Llms-Txt
        value: /llms.txt
  # Hashed build assets never change under the same name.
  - pattern: '/_astro/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  # Generated for agents on every build; should not be served stale.
  - pattern: '/llms*.txt'
    headers:
      - key: Cache-Control
        value: 'public, max-age=300, must-revalidate'
